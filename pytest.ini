[pytest]
# Pytest configuration for Claude Plays Pokemon

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options
addopts =
    --verbose
    --cov=src
    --cov-report=term-missing
    --cov-report=html

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
